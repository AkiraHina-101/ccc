<div class="page">
	<h2>エッジを面に投影</h2>
<div class="contents">
	<p>選択したエッジを最短距離で、選択したフェースに投影します。
	</p>

	<img src="./Media/CommandDlg/MidPlane%20Edit_Add%20Items_Edge_Project%20Edge%20to%20Face.PNG">

	<h4>エッジをフェースに投影</h4>
	<li><b>エッジに延長</b></li>
		<p>&nbsp;&nbsp;&nbsp;選択したエッジを最短距離で、選択したフェースに投影します。また、生成されたエッジは隣接エッジまで自動で延長されます。</p>
	</li>
	
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
			<li>&nbsp;投影するエッジを選択します。</li>
			<li>&nbsp;投影先のフェースを選択します。</li>
			<li>&nbsp;必要に応じて、オプションを設定します。
			<li>&nbsp;適用またはOKボタンを押します。</li>
		</ol>
