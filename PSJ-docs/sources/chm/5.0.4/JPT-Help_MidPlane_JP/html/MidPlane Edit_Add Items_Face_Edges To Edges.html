<div class="page">
	<h2>エッジ―エッジ間</h2>
	<div class="contents">
	<p>
	選択した2 つのエッジ間にフェースを作成します。
	</p>
	<p>
	<img src="./Media/CommandDlg/MidPlane%20Edit_Add%20Items_Face_Edges%20To%20Edges.PNG">
	</p>
	<!--<p></p>-->
	<!--<img src="./Media/Connections_Details_Rigid Elements_RBE2_one to many_02.png">
	<img src="./Media/Connections_Details_Rigid Elements_RBE2_one to many_01.png">-->

	<h4>オプション</h4>
	<li>エッジのインプリント
	<p>
	チェックを入れるとフェース作成時に隣接フェースにエッジを作成します。
	</p>
	<li>複数エッジ
	<p>
	チェックを入れるとエッジ選択の順番からフェースを作成します。また作成されたフェースが交差している場合は、交差部分のフェースを分割します。
	</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>２つのエッジを選択します。</li>
	<li>必要に応じて、オプションを設定します。</li>
	<li>適用またはOKボタンを押します。</li>
	</ol>
