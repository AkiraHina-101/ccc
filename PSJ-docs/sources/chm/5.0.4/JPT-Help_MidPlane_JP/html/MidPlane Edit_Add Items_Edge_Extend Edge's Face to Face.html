<div class="page">
	<h2>フェース間にエッジを延長</h2>
	<div class="contents">
	<p>
	選択したエッジが属するフェース延長面と選択したフェースの交線に、エッジを投影します。<br>
	１エッジと１フェースに対応しております。
	</p>
	<p>
	<img src="./Media/CommandDlg/MidPlane%20Edit_Add%20Items_Edge_Extend%20Edge's%20Face%20to%20Face.PNG">
	</p>
	<!--<p></p>-->
	<!--<img src="./Media/Connections_Details_Rigid Elements_RBE2_one to many_02.png">
	<img src="./Media/Connections_Details_Rigid Elements_RBE2_one to many_01.png">-->

	<h4>フェース間エッジ延長オプション</h4>
	<li>隣接エッジ方向
	<p>
	選択したエッジに属するフェースの形状を考慮して、エッジをフェースに投影します。
	</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>投影するエッジを選択します。</li>
	<li>投影先のフェースを選択します。</li>
	<li>必要に応じて、オプションを設定します。</li>
	<li>適用またはOKボタンをクリックします。</li>
	</ol>
