<div class="page">
	<h2>フェースにフェースを延長</h2>
	<div class="contents">
	<p>
	２つのフェースを選択して、１つのフェースを延長します。
	</p>
	<p>
	<img src="./Media/CommandDlg/MidPlane%20Edit_Add%20Items_Face_Face%20Extend%20To%20Face.PNG">
	</p>
	<!--<p></p>-->
	<!--<img src="./Media/Connections_Details_Rigid Elements_RBE2_one to many_02.png">
	<img src="./Media/Connections_Details_Rigid Elements_RBE2_one to many_01.png">-->

	<h4>オプション</h4>
	<li>フェースをマージ
	<p>
	作成されたフェースをマージします。
	</p>
	</li>
	<li>エッジをマージ
	<p>
	元のフェースと作成したフェースのエッジ間角度が入力値以上の場合に、エッジもマージします。
	</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>「延長フェース」と「参照フェース」を1つずつ選択します。</li>
	<li>必要に応じて、オプションを設定します。</li>
	<li>適用またはOKボタンを押します。</li>
	</ol>
