<div class="page">
	<h2>節点移動 | スムージング-要素品質-</h2>
<div class="contents">
	<p>選択フェース/エレメント/節点集合内の品質の悪いメッシュを、メッシュの節点を移動することによって解消します。</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Move%20Node_Smoothing_Refine%20Quality.png"><br><br>

	<h4>要素品質</h4>
		<li>計測方法　： 品質確認方法を指定します。</li>
			<font color="red">
				&nbsp;&nbsp;&nbsp;&nbsp;※各項目については<a href="./Mesh Cleanup_Mesh Quality_Manual Check_Metric.html">＜品質確認方法の定義＞</a>をご参照下さい。
			</font>
		</li>
		<br>
		<br>
		<li>対象要素<br>
		  &nbsp;&nbsp;&nbsp;&nbsp;節点移動の対象要素を指定します。（Tri & Quadのみ。）
		</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
		<li>品質の悪い要素を含むフェース/要素群/節点群を選択します。</li>
		<li>計測方法を指定します。</li>
		<li>&nbsp;適用またはOKボタンをクリックします。</li>
		</ol>
		<img src="./Media/Mesh%20Edit_Node%20Manipulation_Move%20Node_Smoothing_Refine%20Quality2.png"><br><br>
