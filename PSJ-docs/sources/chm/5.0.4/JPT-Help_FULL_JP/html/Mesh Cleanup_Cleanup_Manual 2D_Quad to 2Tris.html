<div class="page">
	<h2>Quadから2Tris</h2>
	<div class="contents">
	<p>
	1つの四角形要素を2つの三角形要素に変換します。<br>
	要素上をマウスオーバーすると分割線をプレビュー表示し、分割パターンが複数ある場合は、分割パターンのプレビュー表示が切り替わるため、確認しながら分割が行えます。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Cleanup_Cleanup_Manual_Quad%20to%202Tris.png">

	<h4>設定</h4>
	<li>自動実行
	<p>チェックを入れると、要素を選択すると自動で変換します。</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>自動実行のチェックボックスをオンにします。</li>
	<li>三角形要素に変換する要素を、分割線をプレビュー表示したまま選択します。</li>
	<li>選択と同時に変換します。</li>
	</ol>


	<img src="./Media/ManualCleanup_Cleanup_Manual_SplitElement_Quadto2Tris.PNG">
