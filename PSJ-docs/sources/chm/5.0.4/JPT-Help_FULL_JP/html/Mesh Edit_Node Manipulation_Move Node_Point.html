<body>
<div class="page">
<h2>節点移動 | 任意点</h2>
	<div class="contents">
	<p>移動先を任意点の指定によって指示し、節点を移動します。</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Move%20Node_Edge%20Point.png">
	
	<h4>ポジション</h4>
		<li><b>X</b></li>
			<p>&nbsp;&nbsp;&nbsp;X方向の座標が指定されます。</p>
		<li><b>Y</b></li>
			<p>&nbsp;&nbsp;&nbsp;Y方向の座標が指定されます。</p>
		<li><b>Z</b></li>
			<p>&nbsp;&nbsp;&nbsp;Z方向の座標が指定されます。</p>
	<br>
	
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
			<li>&nbsp;選択リストの任意点ボタンを選択します。</li>
			<li>&nbsp;移動先になる任意点を指定します。</li>
			<li>&nbsp;選択リストの節点ボタンを選択します。</li>
			<li>&nbsp;移動する節点を選択します。</li>
			<li>&nbsp;適用またはOKボタンを押します。</li>
		</ol>
