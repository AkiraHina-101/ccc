	<h2>エッジコラプス</h2>
	<div class="contents">
	<p>
	要素の節点を移動してエッジを潰し、周りの要素を結合します。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Cleanup_Cleanup_Manual%203D_Edge%20Collapse.png">

	<h4>エッジコラプス</h4>


	<h3>-&nbsp操作手順&nbsp-</h3>
	<li>エッジと節点を選択し、節点を移動してエッジを潰し、周りの要素を結合します。</li>
	<ol>
	<li>コラップスしたい要素のエッジと移動する節点を選択します。</li>
	<li>適用ボタンをクリックします。</li>
	<li>選択した要素がエッジ中央で潰され、周りの要素が結合されます。</li>
	</ol>


	<img src="./Media/Mesh%20Cleanup_Cleanup_Manual%203D_Edge%20Collapse_1.png">
