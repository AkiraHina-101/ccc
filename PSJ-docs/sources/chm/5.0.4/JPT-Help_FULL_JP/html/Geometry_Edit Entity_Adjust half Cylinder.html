<div class="page">
	<h2>半円筒面を調整</h2>
<div class="contents">
	<p>このコマンドではボルトおよびボルト穴などの円筒面分割位置を揃えます。<br>
	円筒面分割位置の違いによるメッシュ分割の不揃いを回避します。</p>

	<img src="./Media/CommandDlg/Geometry_Edit%20Entity_Adjust%20half%20Cylinder.png"><br><br>
	<img src="./Media/Geometry_Edit%20Entity_Adjust%20half%20Cylinder_example.png">
	
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
		<li>分割位置を揃えたいフェースを選択します。</li>
		<li>座標系で参照したい座標系を選択します。</li>
		<li>基準面指定で分割位置の方向を選択します。</li>
		<li>適用/OKボタンをクリックします。</li>
		</ol>
