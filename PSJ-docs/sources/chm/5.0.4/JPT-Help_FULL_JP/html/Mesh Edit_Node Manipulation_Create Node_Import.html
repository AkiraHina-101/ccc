<div class="page">
	<h2>インポート</h2>
	<div class="contents">
	<p>
	CSVファイルやBDFファイルから節点データを読み込みます。読み込まれた節点データから、パーツに所属しない浮遊点を作成します。<br>
	＊CSVファイルは、X,Y,Z[Enter]で記述されたCSV形式のファイルを意味します。<br>
	＊BDFファイルは、Nastran BDF形式とTSV Geometry BDF形式のファイルを意味します。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Create%20Node_Import.png">

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>ファイル選択ウィンドウで拡張子を選択します。</li>
	<li>読み込むファイルを選択して、OKボタンをクリックします。</li>
	<li>確認画面でOK/Cancelボタンをクリックします。</li>
	</ol>
