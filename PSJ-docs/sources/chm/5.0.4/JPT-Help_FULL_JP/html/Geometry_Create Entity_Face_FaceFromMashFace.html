	<h2>メッシュ面から面作成</h2>
	<div class="contents">
	<p>
	選択されたフェースの節点情報から、数学的補間により元のCAD面を類推したフェースを作成します。<br>
	作成されたフェースは新しいパーツとして登録され、たとえばCADプロジェクション機能の対象CADパーツとして利用できます。
	</p>

	<img src="./Media/CommandDlg/Geometry_Create%20Entity_Face_Face%20From%20Mesh%20Face.png">

	<li>フェースを選択します。（複数選択不可）</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
