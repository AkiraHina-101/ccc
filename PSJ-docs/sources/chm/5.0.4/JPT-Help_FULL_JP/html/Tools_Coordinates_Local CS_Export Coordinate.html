<div class="contents">
	<p>
	選択したローカル座標系をBDFファイル形式で出力します。</br>

	</p>
	<p>

	</br>

	</br>
	</p>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>出力するローカル座標系を選択します。</li>
	<li>座標系のエクスポートコマンドをクリックし、「名前を付けて保存」ダイアログを開きます。</li>
	<li>保存先、及び保存名を指定して保存ボタンをクリックします。</li>
	</ol>
