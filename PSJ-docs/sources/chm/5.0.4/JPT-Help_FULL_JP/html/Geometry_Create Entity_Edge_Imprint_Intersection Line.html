<div class="page">
	<h2>交差ライン</h2>
<div class="contents">
	<p>選択した2つのフェースが交差する位置にラインを作成します。</p>

	<img src="./Media/CommandDlg/Geometry_Create%20Entity_Edge_Imprint_Intersection%20Line.png">

	<h4>オプション</h4>
		<li><b>面を分割</b></li>
			<p>&nbsp;&nbsp;&nbsp;インプリントしたエッジによってフェース分割が可能な場合、フェースを分割します。</p>
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
		<li>&nbsp;インプリント対象の2枚の交差するフェースを画面より選択します。</li>
		<li>&nbsp;必要に応じて面を分割チェックボックスをオフにします。この場合はインプリント後のフェースが元のフェースから分割されません。</li>
		<li>&nbsp;適用/OKボタンをクリックします。</li>
		</ol>
