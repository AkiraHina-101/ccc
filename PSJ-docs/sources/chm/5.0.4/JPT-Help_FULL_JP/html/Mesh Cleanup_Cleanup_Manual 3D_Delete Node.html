<div class="page">
	<h2>節点削除</h2>
	<div class="contents">
	<p>
	選択した節点を削除し、関連要素の節点構成を変更します。元のメッシュ領域は保持されます。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Cleanup_Cleanup_Manual%203D_Delete%20Node.png">

	<h4>節点削除</h4>


	<h3>-&nbsp操作手順&nbsp-</h3>
	<li>選択した節点を削除し、関連要素の節点構成を変更します。</li>
	<ol>
	<li>削除したい節点を選択します。一度に1節点のみが有効です。</li>
	<li>適用ボタンをクリックします。</li>
	<li>選択した節点がモデル上から削除され、元のメッシュ領域を保持するように関連要素の節点構成が変更されます。</li>
	</ol>


	<img src="./Media/Mesh%20Cleanup_Cleanup_Manual%203D_Delete%20Node_1.png">
