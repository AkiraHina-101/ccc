<div class="page">
	<h2>節点移動 | 平面に投影(3節点)</h2>
<div class="contents">
	<p>任意の対象節点を、3つの参照節点で定義された平面上に、最短距離で動かします。</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Move%20Node_Project%20To%20Plane%20(3%20Nodes).png">
	<br>
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
		<li>&nbsp;選択リストの「参照節点」をクリックし、投影する平面を定義するための3節点を選択します。</li>
		<li>&nbsp;選択リストの「対象節点」をクリックし、移動する節点または浮遊点を選択します。（複数選択可）</li>
		<li>&nbsp;適用/OKボタンをクリックします。</li>
		</ol>
