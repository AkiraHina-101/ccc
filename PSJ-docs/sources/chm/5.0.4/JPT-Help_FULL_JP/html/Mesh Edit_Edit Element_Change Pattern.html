	<h2>パターンを変更</h2>
	<div class="contents">
	<p>
	選択したフェースのメッシュパターンを変更します。<br>
	</p>

	<img src="./Media/CommandDlg_JP/Mesh%20Cleanup_Edit%20Element_Chang%20Pattern.png">

	<h4>エンティティタイプ</h4>
	<li>パターンタイプを変更
	<p>標準を選択すると、標準のマップメッシュに変更します。</p>
	<p>ユニオンジャックを選択すると、ユニオンジャックのメッシュパターンに変更します。</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>フェースを選択します。</li>
	<li>パターンタイプを変更でメッシュパターンを選択します。</li>
	<li>適用またはOKボタンで機能が実行されます。</li>
	</ol>
