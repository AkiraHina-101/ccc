<div class="contents">
	<h4>円筒面 レイヤーダイアログボックス</h4>
	<p>
	円筒面を含む円筒ボディの内側にオフセットした円筒面を作成します。<br>
	</p>

	<img src="./Media/CommandDlg/Assemble_Generate_Layer_Cylinder_Layer.PNG">

	<h4>円筒面 レイヤー</h4>
	延長したいエッジを含むフェースと長さを決める節点を選択します。<br>
	エッジは円筒面の法線方向に選択した節点位置まで延長されます。<br>


<h3>-&nbsp操作手順&nbsp-</h3>

	<ol>
	<li>インプリントエッジでオフセットラインを作成します。<br>
	  <img src="./Media/Assemble_Generate_Layer_Cylinder_Layer2.PNG">
	</li>
	<li>延長したいエッジを含むフェースと長さを決める節点を選択し、適用またはOKボタンを押します。<br>
	  <img src="./Media/Assemble_Generate_Layer_Cylinder_Layer3.PNG">
	</li>
	<li>内側のフェースを選択し、マウス右クリックメニューの非表示を選択すると、内部にフェースが作成されたことが確認できます。<br>
	  <img src="./Media/Assemble_Generate_Layer_Cylinder_Layer4.PNG">
	</li>
	</ol>
