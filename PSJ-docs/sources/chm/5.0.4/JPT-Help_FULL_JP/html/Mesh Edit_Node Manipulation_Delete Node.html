<h2>節点削除</h2>
	<div class="contents">
	<p>モデル内のすべての浮遊節点あるいは指定した浮遊節点を削除します。</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Delete%20Node.png">
	
	<h4>浮遊点削除</h4>
	
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<li>選択した節点のみ削除する場合</li>
		<ol>
			<li>&nbsp;削除する浮遊節点を選択します。</li>
			<li>&nbsp;適用またはOKボタンを押します。</li>
		</ol>
		<br>
		<li>すべての浮遊節点を削除する場合</li>
		<ol>
			<li>&nbsp;(節点を選択せず)適用またはOKボタンを押します。</li>
		</ol>
