<div class="page">
	<h2>MPC一般 | 2フェース間</h2>
	<div class="contents">
	<p>
	複数フェース間でMPCを作成する機能です。
	</p>
	<p>
	<img src="./Media/Connections_Details_MPC_General_2%20Faces.png">
	</p>

	<h4>2フェース</h4>
	<li>名前
	<p>
	登録される名前を入力します。
	</p>
	</li>

	<h4>パラメーター</h4>
	<li>座標系
	<p>
	参照座標系を選択します。
	</p>
	</li>
	<li>TX変位 - TZ変位
	<p>
	並進方向の拘束を指定します。
	</p>
	</li>
	<li>RX変位 - RZ変位
	<p>
	回転方向の拘束を指定します。
	</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>マスターのフェースを選択します。</li>
	<li>スレーブのフェースを選択します。</li>
	<li>パラメータを設定します。</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
