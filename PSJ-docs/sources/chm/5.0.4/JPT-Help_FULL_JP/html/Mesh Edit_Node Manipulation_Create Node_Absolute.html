<h2>任意</h2>
	<div class="contents">
	<p>座標入力によって浮遊節点を追加します。</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Create%20Node_Absolute.png">
	
	<h4>プロパティ</h4>
		<li><b>座標系</b></li>
			<p>&nbsp;&nbsp;&nbsp;座標系を指定します。</p>
		<li><b>接点番号</b></li>
			<p>&nbsp;&nbsp;&nbsp;節点番号を入力します。</p>
		<li><b>X</b></li>
			<p>&nbsp;&nbsp;&nbsp;X座標を入力します。</p>
		<li><b>Y</b></li>
			<p>&nbsp;&nbsp;&nbsp;Y座標を入力します。</p>
		<li><b>Z</b></li>
			<p>&nbsp;&nbsp;&nbsp;Z座標を入力します。</p>
	<br>
		
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
			<li>&nbsp;接点番号を指定します。</li>
			<li>&nbsp;作成する位置を座標で指示します。</li>
			<li>&nbsp;適用またはOKボタンを押します。</li>
		</ol>
