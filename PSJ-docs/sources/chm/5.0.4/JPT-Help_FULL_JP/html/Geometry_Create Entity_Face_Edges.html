<div class="page">
	<h2>エッジ</h2>
<div class="contents">
	<p>
	選択エッジ間にフェースを作成します。<br>
	作成時にパーツを選択することで、作成したフェースを選択パーツに所属させることができます。
	</p>

	<img src="./Media/CommandDlg/Geometry_Create%20Entity_Face_Edges.png">
  　　<li>共有面
	<p>
	共有面上のエッジ間に共有面を作成します。
	</p>
　　　</li>
 　　　<li>スムースシェーディング
	<p>
	選択したエッジ間になめらかなフェースを作成します。
	</p>
	<img src="./Media/Geometry_CreateEntity_Face_Edges_8.png">
　　　</li>
 　　　<li>新規作成
	<p>
	フェースを新規パーツとして作成します。
	</p>
　　　</li>

      <h3>-&nbsp操作手順&nbsp-</h3>
      <ol>
        <li>エッジを複数本選択します。</li>
        <li>適用/OKボタンをクリックします。</li>
      </ol>
