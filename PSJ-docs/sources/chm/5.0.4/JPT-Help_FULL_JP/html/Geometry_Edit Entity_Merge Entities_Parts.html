<div class="page">
	<h2>パーツ</h2>
<div class="contents">
	<p>
	複数のパーツを一つのパーツにマージします。<br>
	フェースやエッジ等に設定されていた荷重条件や材料プロパティ等は、マージパーツへ更新されます。
	</p>
	<img src="./Media/CommandDlg/Geometry_Edit%20Entity_Merge%20Entities_Parts.png">

	<h4>オプション</h4>
	<li>共有面を削除
	<p>
	チェックを解除すると共有面をパーティションとして残します。チェックをすると共有面を削除します。
	</p>
	</li>
	<li>トレランス
	<p>
	マージを実行するときのトレランスを設定します。
	</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>パラメータを設定します。</li>
	<li>マージする複数のパーツを選択します。</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
