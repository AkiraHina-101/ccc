<div class="page">
	<h2>スイープ | 中立面から作成</h2>
	<div class="contents">
	<p>
	シェルプロパティ（板厚の指定）が割り当てられている中立面パーツに対して、設定されている厚さだけスイープしてヘキサメッシュを作成します。</br>
	</p>

	<img src="./Media/CommandDlg/Hex%20Modeling_Sweep_From%20MidPlane.png"></img>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>あらかじめ中立面パーツに２Dシェルプロパティを割り当て、厚さを指定します.</li> 
	<br><img src="./Media/Hex%20Modeling_Sweep_From%20MidPlane_example_01.png"></img></br>
	<br><img src="./Media/Hex%20Modeling_Sweep_From%20MidPlane_example_02.png"></img></br>
	<li>パーツを選択します。</li>
	<br><img src="./Media/Hex%20Modeling_Sweep_From%20MidPlane_example_03.png"></img></br>
	<font color="red">
		※注意: 複数のパーツが選択可能です。選択パーツにはすべて２Dシェルプロパティが割り当てられている必要があります。
	</font>
	<li>「適用」または「OK」ボタンをクリックしてメッシュを生成します.</li>
	<br>結果：</br>
	<img src="./Media/Hex%20Modeling_Sweep_From%20MidPlane_example_04.png"></img>
	</ol>
	</div>
</div>
