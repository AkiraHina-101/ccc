<div class="page">
<h2>面積[フェース]</h2>
	<div class="contents">
	<p>フェースの面積を計測します。</p>

	<img src="./Media/CommandDlg/Tools_Information_Measure_Area_Face.png">

 　　 <h4>出力</h4>
		<li><b>面積</b><br>
			<p>&nbsp;&nbsp;&nbsp;計測結果（フェースの面積）が表示されます。</p>
		</li>
		<li><b>合計値</b><br>
			<p>&nbsp;&nbsp;&nbsp;計測結果（フェースの累計面積）が表示されます。</p>
		</li>
		<li><b>入力単位系</b><br>
			<p>&nbsp;&nbsp;&nbsp;表示する面積の単位を指示します。</p>
		</li>
	<br>
		
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
			<li>&nbsp;フェースを選択します。</li>
			<li>&nbsp;面積に直前に選択したフェースの面積、合計値に選択されたフェースの合計面積が表示されます。</li>
		</ol>
