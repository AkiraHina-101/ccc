<body>
	<div class="page">
		<h2>フェース-節点</h2>
	<div class="contents">
		<p>フェースが定義する平面に向かって節点から垂線を下ろした距離を計測します。</p>

	<img src="./Media/CommandDlg/Tools_Information_Measure_Distance_Face-Node.png">

	<h4>出力</h4>
		<li><b>距離</b><br>
			<p>&nbsp;&nbsp;&nbsp;計測結果が表示されます。</p>
		</li>
		<li><b>入力単位系</b><br>
			<p>&nbsp;&nbsp;&nbsp;表示する距離の単位を指示します。</p>
		</li>
	<br>
	
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
			<li>&nbsp;画面上からフェース1つと節点1つを選択します。</li>
			<li>&nbsp;距離に平面と節点間の最短距離が表示されます。</li>
     	</ol>
