<body>
<div class="page">
	<h2>球の中心</h2>
	<div class="contents">
	<p>
	選択した球面フェースまたは球面上の4節点の曲率中心に節点を作成します。フェースは球面の一部でもかまいません。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Create%20Node_Sphere%20Center.png">

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>中心位置に節点を作成する球面フェースまたは球面上の4節点を選択します。選択すると中心位置座標値がダイアログボックスに表示されます。</li>
	<li>必要に応じて希望する節点番号を入力します。既存の節点番号と重複はできません。自動的に重複を避けて振り替えられます。</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
