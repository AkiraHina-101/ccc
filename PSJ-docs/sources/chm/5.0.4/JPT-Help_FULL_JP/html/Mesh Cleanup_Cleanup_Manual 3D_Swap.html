	<h2>スワップ</h2>
	<div class="contents">
	<p>
	選択した要素エッジの接続節点を所属する要素の他の節点に切り替えます。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Cleanup_Cleanup_Manual%203D_Swap.png">

	<h4>スワップ</h4>


	<h3>-&nbsp操作手順&nbsp-</h3>
	<li>要素エッジを選択し、その接続節点を切り替えます。</li>
	<ol>
	<li>スワップしたい要素エッジを選択します。</li>
	<li>適用ボタンをクリックします。</li>
	<li>選択した要素エッジが他の節点に切り替わります。この時関連要素の節点接続構成も変更されます。</li>
	</ol>


	<img src="./Media/Mesh%20Cleanup_Cleanup_Manual%203D_Swap_1.png">
