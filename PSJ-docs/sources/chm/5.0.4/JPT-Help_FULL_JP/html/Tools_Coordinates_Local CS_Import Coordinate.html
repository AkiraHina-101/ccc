<div class="page">
	<h2>ローカル座標系 座標系のインポート</h2>
<div class="contents">
	<p>
	次のソルバーファイルに入ったローカル座標系を読み込みます。</br>
	読み込み可能ファイル形式：*.bdf, *.adx, *.inp</br>

	</p>
	<p>
	<img src="./Media/Tools_Coordinates_Local%20CS_Import%20Coordinate_a.png" width="500"></br>
	</br>
	<img src="./Media/Tools_Coordinates_Local%20CS_Import%20Coordinate_b.png" width="500"></br>
	</br>
	</p>

	</div>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>座標系のインポートコマンドをクリックして「開く」ダイアログを開きます。</li>
	<li>ローカル座標系の入ったファイルを選択し、開くボタンをクリックします。</li>
	</ol>
	<h3>-&nbsp特記事項&nbsp-</h3>
	<ol>
	<li>名称については、Jupiterフォーマットで作成されたファイルのみ、名称読み込みに対応しています。</li>
	</ol>
	
</div>
