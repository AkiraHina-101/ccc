<div class="page">
	<h2>ハーフエッジコラプス</h2>
	<div class="contents">
	<p>
	要素を選択した要素エッジの中央に向けて潰して周りの要素を結合します。
	</p>

	<img src="./Media/Mesh%20Cleanup_Cleanup_Manual%202D_Half-Edge%20Collapse.png">

	<h4>ハーフエッジコラプス</h4>
    <li>頂点の位置を保持
    <p>チェックを入れると、選択した要素エッジに頂点が含まれている場合その要素エッジに対する結合の実行をスキップし、モデルの形状が崩れる事を防止します。</p>
    </li>
	<h3>-&nbsp操作手順&nbsp-</h3>
	<li>選択したエッジの中心で要素を潰し周りの要素を結合します。</li>
	<ol>
	<li>コラップスしたい要素のエッジを選択します。</li>
	<li>適用ボタンをクリックします。</li>
	<li>選択した要素がエッジ中央で潰され、周りの要素が結合されます。</li>
	</ol>


	<img src="./Media/Mesh%20Cleanup_Cleanup_Manual%203D_Half-Edge%20Collapse_1.png">
