<div class="page">
	<h2>パーツ構成変更 | 要素 | 表面要素</h2>
	<div class="contents">
	<p>
	選択した要素を別のパーツに属させます。<br>
	</p>

	<img src="./Media/CommandDlg/Mesh%20Cleanup_Change%20Topology_Element.png">

	<h4>オプション</h4>
	<li>新規作成
	<p>チェックを入れると、選択した要素で新たにパーツを作成します。</p>
	<p>チェックを入れない場合は、選択したパーツに要素を属させます。</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>フェースを選択します。</li>
	<li>別のパーツに属させる場合はパーツを選択します。(新規作成はチェックオフ)</li>
	<li>新たにパーツを作成する場合は新規作成にチェックを入れます。</li>
	<li>適用またはOKボタンで機能が実行されます。</li>
	</ol>


	<img src="./Media/Mesh%20Cleanup_Change%20Topology_Element_example.png">
