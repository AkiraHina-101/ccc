<body>
<div class="page">
	<h2>直線に投影</h2>
	<div class="contents">
	<p>
	3点目以降に選択した節点または浮遊節点を、最初に選択した2つの節点または浮遊節点の間の直線に最短距離で投影します。投影された位置に浮遊節点が作成されます。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Create%20Node_Project%20To%20Line.png">

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>投影する直線を定義するため、2節点または浮遊節点を選択します。</li>
	<li>投影される節点または浮遊節点を選択します。（複数選択可）</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
