<div class="page">
	<h2>段階メッシュ</h2>
<div class="contents">
	<p>このコマンドでは、選択した先の尖った四辺形状のフェースに段階的なマップドメッシュを作成します。
先の尖った四辺形状フェースとCADモデルを選択し、OKボタンを押すと選択面に段階的なマップドメッシュを作成します。</p>
	
	<img src="./Media/CommandDlg/Meshing_Local%20Meshing_Variable_Mapped.png">
	
	<h4>パラメータ</h4>
		<li><b>メッシュサイズ</b>
			<p>&nbsp;&nbsp;&nbsp;メッシュサイズを指定します。</p>
		</li>

	</br>

	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
		<li>&nbsp;メッシュ再作成の対象となるフェースを1つ選択します。一度に処理できるフェースは1つのみです。</li>
		<li>&nbsp;作成するメッシュサイズを入力します。</li>
		<li>&nbsp;適用/OKボタンをクリックします。</li>
		</ol>
