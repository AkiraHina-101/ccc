	<div class="contents">
	<p>円弧エッジの半径を計測します。</p>

	<img src="./Media/CommandDlg/Tools_Information_Measure_Radius_Edge.png">
	
	<h4>出力</h4>
		<li><b>半径</b><br>
			<p>&nbsp;&nbsp;&nbsp;計測結果が表示されます。</p>
		</li>
		<li><b>入力単位系</b><br>
			<p>&nbsp;&nbsp;&nbsp;表示する半径の単位を指示します。</p>
		</li>
		
	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
		<li>&nbsp;円孤エッジを1つ選択します。</li>
		<li>&nbsp;半径に円孤エッジにより定義される円の半径が表示されます。</li>
		</ol>
