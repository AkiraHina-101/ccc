<div class="page">
	<h2>節点移動 | 平面に投影(要素)</h2>
<div class="contents">
	<p>選択した節点または浮遊点を、要素により定義される平面に、最短距離で投影します。<br>
	投影された位置に、選択した節点または浮遊点が移動します。</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Move%20Node_Project%20To%20Plane%20(Elem).png">
	<br>

	<h3>-&nbsp;操作手順&nbsp;-</h3>
		<ol>
			<li>&nbsp;投影する平面を定義するため、1要素を選択します。</li>
			<li>&nbsp;移動する節点または浮遊点を選択します。（複数選択可）</li>
			<li>&nbsp;適用/OKボタンをクリックします。</li>
		</ol>
