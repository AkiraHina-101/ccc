<body>
<div class="page">
	<h2>円弧エッジの中心</h2>
	<div class="contents">
	<p>
	選択した円形エッジの中心位置に節点または浮遊点を作成します。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Create%20Node_Circle%20Center.png">

	<h4>プロパティ</h4>
	<li>節点番号
	<p>
	作成される節点のIDが表示されます。
	</p>
	</li>
	<li>X, Y, Z
	<p>
	作成される節点の座標が表示されます。
	</p>
	</li>
	<li>インプリント
	<p>
	チェックオンの場合、フェースに節点を作成します。チェックオフの場合、浮遊点を作成します。
	</p>
	</li>

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>円形のエッジを選択します。</li>
	<li>インプリントがチェックオンの場合、対象のフェースを選択します。</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
