<div class="page">
	<h2>ボックスメッシュ</h2>
	<div class="contents">
	<p>
	モデルを包含するようにヘキサ要素で構成された直方体を作成します。<br>
	</p>

	<img src="./Media/CommandDlg/Hex%20Modeling_Box%20Mesh_Box%20Mesh.PNG">

	<h4>ボックスメッシュ</h4>
	<li>メッシュサイズ
	<p>作成ヘキサ要素のサイズを入力します。</p>
	</li>
	<h4>材料</h4>
	<li>ファイルパス
	<p>
	選択ボタンで材料ファイルを指定します。<br>
	</p>
	</li>
	<li>材料
	<p>
	プルダウンから材料を指定します。
	</p>
	</li>

	<img src="./Media/Hex%20Modeling_Box%20Mesh_Box%20Mesh_example.PNG">


	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>CADのパーツを選択します。</li>
	<li>メッシュサイズを指定します。</li>
	<li>材料ファイルパスを指定します。</li>
	<li>材料を選択します。</li>
	<li>適用もしくはOKボタンをクリックします。</li>
	</ol>
