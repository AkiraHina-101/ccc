	<h2>円筒面の中心</h2>
	<div class="contents">
	<p>
	選択した円筒面の曲率中心と長さ方向中央点に節点を作成します。
	</p>

	<img src="./Media/CommandDlg/Mesh%20Edit_Node%20Manipulation_Create%20Node_Cylinder%20Center.png">

	<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>中心位置に節点を作成する円筒面を選択します。（複数選択可）</li>
	<li>必要に応じて希望する節点番号を入力します。既存の節点番号と重複はできません。</li>
	<li>適用/OKボタンをクリックします。</li>
	</ol>
