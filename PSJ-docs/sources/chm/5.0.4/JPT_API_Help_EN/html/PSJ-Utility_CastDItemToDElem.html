<div class="page">
<h2>CastDItemToDElem</h2>
<div class="contents">
<h4>Description</h4>
<p>Cast a DItem object to DElem object</p>
<h4>Inputs</h4> 
<ol>
    <li><p>DItem object (DItem class)</p> <!--remove D  What's "enum"?-->
</ol>
<h4>Return Code</h4>
<p>DElem object (DElem class)</p>
<h4>Sample Code</h4>
<p>listDItemObject = JPT.GetAllByType(JPT.DItemType.ELEM)</p>
<p>ditemObject = listDItemObject[0]</p>
<p>JPT.CastDItemToDElem(ditemObject)</p>
