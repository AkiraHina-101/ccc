<body>
<div class="page">
<h2>File Menu</h2>
<div class="contents">
<h4>File</h4>
<img src="./Media/IDE_File.png">
<br>
<br>
<table class="commontable">
	<tr>
		<th>Name</th>
	    <th>Description</th>
	    <th>Shortcut key</th>
    </tr>	
	<tr>
		<td>New</td>
		<td>Open a new document.</td>
	    <td>Ctrl + N</td>
	</tr>
	<tr>
		<td>Open</td>
		<td>Open a saved Python script file.</td>
	    <td>Ctrl + O</td>
	</tr>
	<tr>
		<td>Save</td>
		<td>Save the Python script file.</td>
	    <td>Ctrl + S</td>
	</tr>
	<tr>
		<td>Save As</td>
		<td>Save the Python script file with a different name.</td>
	    <td>Ctrl + E</td>
	</tr>
	<tr>
		<td>Exit</td>
		<td>Close the IDE.</td>
	    <td>Ctrl + Q</td>
	</tr>
</table>

</div>
</div>
