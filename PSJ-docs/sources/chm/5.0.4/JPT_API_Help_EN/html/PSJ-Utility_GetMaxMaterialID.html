<h2>GetMaxMaterialID</h2>
	<div class="contents">
<h4>Description</h4>
	<p>Get maximum id of material inside a document.</p>
<h4>Syntax</h4>
	<p>GetMaxMaterialID()</p>
<h4>Inputs</h4> 
	<ol>

		<li>None<p>No input value</p></li>

	</ol> 
<h4>Return Code</h4>
	<p><em>Python Output</em></p>
	<ul>
		<li>int<p>Material ID</p></li>
	</ul>
<h4>Sample Code</h4>
	<p><em>Input:</em></p>
	<p style = "margin-left: 40px">id = JPT.GetMaxMaterialID()</p>
	<p style = "margin-left: 40px">print(str(id))</p>
	<p><em>Output:</em></p>	
	<p style = "margin-left: 40px">> 3</p>

	

</p>
