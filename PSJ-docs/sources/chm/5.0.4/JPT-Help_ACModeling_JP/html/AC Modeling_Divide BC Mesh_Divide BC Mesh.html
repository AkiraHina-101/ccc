<div class="page">
	<h2>境界メッシュ分割</h2>
<div class="contents">
	<p>構造メッシュのPID設定状況から音響の境界メッシュのPIDを分割します。</p>

	<img src="./Media/CommandDlg/AC_Modeling_Divide_BC_Mesh.png">

	<h4>設定</h4>
	<li><b>構造モデル(PID)</b></li>
		<p>&nbsp;&nbsp;&nbsp;構造メッシュのファイルを指定します。</p>	
	</li>
	<li><b>境界メッシュ</b></li>
		<p>&nbsp;&nbsp;&nbsp;音響境界メッシュのファイルを指定します。</p>	
	</li>

	
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
			<li>&nbsp;構造モデル(PID)から、構造モデルのファイルを選択します。</li>
			<li>&nbsp;境界メッシュから、境界メッシュのファイルを選択します。</li>
			<li>&nbsp;OKボタンを押します。</li>
		</ol>
	<img src="./Media/CommandDlg/AC_Modeling_Divide_BC_Mesh_howto.png">
