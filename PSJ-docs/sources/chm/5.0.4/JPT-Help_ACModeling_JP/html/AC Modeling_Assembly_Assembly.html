<div class="page">
	<h2>アッセンブル</h2>
<div class="contents">
	<p>各パーツの表面メッシュ間に連続性を持たせます。
</p>

	<img src="./Media/CommandDlg/AC_Modeling_Assembly.png">

	<h4>アッセンブル</h4>
	<li><b>トレランス</b></li>
		<p>&nbsp;&nbsp;&nbsp;アセンブリのトレランス設定です。</p>
	</li>
	<li><b>検索</b></li>
		<p>&nbsp;&nbsp;&nbsp;アセンブリの対象面を検索します。</p>
	</li>
	<li><b>最小要素長さ</b></li>
		<p>&nbsp;&nbsp;&nbsp;アセンブリエッジ上の最小要素長です。</p>
				<img src="./Media/CommandDlg/AC_Modeling_Assembly_Min_Elem_Length.png">
	</li>

	
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
			<li>&nbsp;パーツ間の隙間に合わせトレランスを入力します。</li>
			<li>&nbsp;検索ボタンを押して、対象面を確認します。</li>
			<li>&nbsp;最小要素長さを入力します。</li>
			<li>&nbsp;ApplyまたはOKボタンを押すことで実行します。</li>
		</ol>
