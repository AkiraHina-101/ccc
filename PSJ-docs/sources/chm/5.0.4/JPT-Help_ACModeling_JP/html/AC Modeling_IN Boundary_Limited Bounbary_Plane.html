<div class="page">
	<h2>無限境界｜制限境界｜平面</h2>
<div class="contents">
	<p>無限境界の制限平面を作成します。
</p>

	<img src="./Media/CommandDlg/AC_Modeling_Limited_Bounbary_Plane.png">

	<h4>平面</h4>
	<li><b>座標平面</b></li>
		<p>&nbsp;&nbsp;&nbsp;全体座標系の座標平面を指定します。</p>	
	</li>
	<li><b>中心点</b></li>
		<p>&nbsp;&nbsp;&nbsp;平面の中心点を指定します。</p>	
	</li>
	<li><b>長さ1</b></li>
		<p>&nbsp;&nbsp;&nbsp;平面のエッジ1軸長です。</p>	
	</li>
	<li><b>長さ2</b></li>
		<p>&nbsp;&nbsp;&nbsp;平面のエッジ2軸長です。</p>	
	</li>
	
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
			<li>&nbsp;無限境界面のパーツを選択します。</li>
			<li>&nbsp;中心点・長さ1・長さ2を入力します。</li>
			<li>&nbsp;Apply/OKボタンを押します。</li>
		</ol>
