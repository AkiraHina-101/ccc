	<h2>無限境界｜制限境界｜円筒面</h2>
<div class="contents">
	<p>無限境界の制限円筒面を作成します。</p>

	<img src="./Media/CommandDlg/AC_Modeling_Limited_Bounbary_Cylinder.png">

	<h4>円筒体</h4>
	<li><b>底面の中心</b></li>
		<p>&nbsp;&nbsp;&nbsp;円筒面の底面中心座標を入力します。</p>	
	</li>
	<li><b>上面の中心</b></li>
		<p>&nbsp;&nbsp;&nbsp;円筒面の上面中心座標を入力します。</p>	
	</li>
	<li><b>半径</b></li>
		<p>&nbsp;&nbsp;&nbsp;円筒面の半径を入力します。</p>	
	</li>

	
	<h3>-&nbsp操作手順&nbsp-</h3>
		<ol>
			<li>&nbsp;無限境界面のパーツを選択します。</li>
			<li>&nbsp;底面中心座標・上面中心座標・半径を入力します。</li>
			<li>&nbsp;Apply/OKボタンを押します。</li>
		</ol>
