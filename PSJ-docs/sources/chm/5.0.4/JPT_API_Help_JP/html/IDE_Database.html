<h4>データベース</h4>
<img src="./Media/IDE_Database.png">

<p>IDEのデータベースはJupiterのインストールフォルダ(.../IDEData/)に保存されています。<br>
   このデータベースは自由に編集することができます。
</p>
<p>各ファイルの内容</p>
<ul>
	<li>Keywords.dat: <br>
		IDE上でハイライトされるキーワード
	</li>
	<br>
	<li>PSJUtilityCalltips.dat: <br>
		PSJ-Utilityの予測変換やコールチップ
	</li>
</ul>
