<body>
<div class="page">
	<h2>Label</h2>
<div class="contents">
	<p>
	ラベルを追加します。<br>
	</p>

	<img src="./Media/GUI_CommandBuilder_Component-Parameter_Label.png">
	<br><br>
	
	<p>&nbsp;&nbsp;&nbsp;作成イメージ図：</p>
	
	<img src="./Media/GUI_CommandBuilder_Component-Parameter_Label2.png">
	<br><br>

	

	<li><b>Text</b>
	<p>&nbsp;&nbsp;&nbsp;ラベルとして表示させるテキストを入力します。</p>
	</li>
	<li><b>Name</b>
	<p>&nbsp;&nbsp;&nbsp;Labelコンポーネント名を入力します。</p>
	</li>
	<li><b>Enable</b>
	<p>&nbsp;&nbsp;&nbsp;使用の可否を指定します。</p>
		<ul type="circle">
		<span style="font-size:0.95em;">
		<li><b>チェックオン</b>&nbsp;:&nbsp;使用可能。</li>
		<li><b>チェックオフ</b>&nbsp;:&nbsp;使用不可。（グレーアウトされます）</li>
		</span>
		</ul>
	</li>
	<li><b>Width</b>
	<p>&nbsp;&nbsp;&nbsp;ラベルの最小幅を指定します。（単位：ピクセル）</p>
	</li>
	<li><b>Height</b>
	<p>&nbsp;&nbsp;&nbsp;ラベルの最小高さを指定します。（単位：ピクセル）</p>
	</li>
	</div>
</div>
</body>
