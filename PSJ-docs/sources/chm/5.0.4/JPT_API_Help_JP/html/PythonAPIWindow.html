<div class="page">
<h2>Python API ウィンドウ</h2>
<div class="contents">
<p>Home > Window > Python API をオンにするとPython APIウィンドウが表示されます。</p>
<img src="./Media/PythonAPIWindow1.PNG">
<br>
<br>
<p><b>① 出力ウィンドウ</b><br>
   &emsp;Pythonコマンドや実行結果が表示されます。
</p>
<img src="./Media/PythonAPIWindow2.PNG">

<p>
   &emsp;黒文字: PSJ-commandの情報<br>
   &emsp;青文字: スクリプト実行結果<br>
   &emsp;赤文字: エラー<br> 
</p>
<br>
<p><b>② IDEランチャーボタン</b><br>
   &emsp;Python IDE を起動します。
</p>
<br>
<p><b>③ Edit Box</b></p>
<img src="./Media/PythonAPIWindow3.PNG">

<p>
   &emsp;Python APIウィンドウから直接Pythonスクリプトを実行することができます。<br>
   &emsp;コピー&ペーストにてコマンド入力が可能です。<br>
</p>
<br>
<br>
