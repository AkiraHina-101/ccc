<html lang="ja" >
<head>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
	  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ja" lang="ja">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=shift_jis" />
    <link href="basic.css" rel="stylesheet" type="text/css" />
       <script language="javascript" src="script/util.js"></script>
<meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
<title>File Launcher</title>
</style>
</head>
<body>
<div class="page">
<h2>File Launcher</h2>
<div class="contents">

<img src="./Media/FileLauncher.png">
<br>
<br>
<table class="commontable">
	<tr>
		<th>ボタン</th>
	    <th>説明</th>
    </tr>	
	<tr>
		<td>S</td>
		<td>Pythonファイルを登録します。</td>
	</tr>
	<tr>
		<td>C</td>
		<td>登録したPythonファイルをクリアします。</td>
	</tr>
	<tr>
		<td>R</td>
		<td>登録済のPythonファイルを別のPythonファイルに置き換えます。</td>
	</tr>
	<tr>
		<td>Func</td>
		<td>登録したPythonプログラムを実行します。</td>
	</tr>
</table>
<br>
<h3>-&nbsp操作手順&nbsp-</h3>
	<ol>
	<li>Sボタンをクリックし、Pythonファイルを選択します。</li>
	<img src="./Media/FileLauncher1.png"><br>
	<li>ファイルを選択するとFunctionボタン左側の緑のマークが赤に変わります。</li>
	<img src="./Media/FileLauncher2.png"><br>
	<li>Functionボタンをクリックするとプログラムが実行されます。</li>
	<img src="./Media/FileLauncher3.png"><br>
	</ol>


</div>
</div>
</body>
</html>
