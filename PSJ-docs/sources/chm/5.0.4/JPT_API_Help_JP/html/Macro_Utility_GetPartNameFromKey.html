<p>Get Part Name From Keys</p>
<h4>Syntax</h4>
<p>GetPartNameFromKey(ID[])</p>
<h4>Inputs</h4>
<ol>
<li>ID[]<p>Part ID(s)</p></li>
</ol>
<h4>Return Code</h4>

<li>FAILED<p>Failed</p></li>
