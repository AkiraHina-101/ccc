<h2>コールチップ</h2>
<div class="contents">
<h4>コールチップ</h4>
<img src="./Media/IDE_Calltips1.png">
<ul>
	<li>コールチップをサポートしています。例えば、"JPT.ClearLog("と入力すると、"JPT.ClearLog"のドキュメントを示すコールチップが表示されます。</li>
	<li>"("の右側をクリックしてCtrl + Shift + Spaceを押すと、コールチップが再び表示されます。</li>
	<li>コールチップのデータは、データベースのPSJUtilityCalltips.datおよびPSJCommandCalltips.datに保存されています。</li>
</ul>
<br>
<h4>ユーザー定義関数のコールチップ</h4>
<img src="./Media/IDE_Calltips2.png">
<ul>
	<li>ユーザー関数にも対応しています。</li>
</ul>
