<h4>Description</h4>
<p>Turn ON/OFF Show Bar Shading as the function called.</p>
<h4>Syntax</h4>
<p>ViewToggleShowBarShading()</p>
<h4>Inputs</h4>
<li>No Arguments</li>
<h4>Return Code</h4>
<li>Nothing<p></li>
