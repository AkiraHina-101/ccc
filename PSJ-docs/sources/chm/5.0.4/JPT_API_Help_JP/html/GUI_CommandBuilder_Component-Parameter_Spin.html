<div class="page">
	<h2>Spin</h2>
<div class="contents">
	<p>
	スピンボタンを追加します。<br>
	</p>

	<img src="./Media/GUI_CommandBuilder_Component-Parameter_Spin.png">
	<br><br>
	
	<p>&nbsp;&nbsp;&nbsp;作成イメージ図：</p>
	
	<img src="./Media/GUI_CommandBuilder_Component-Parameter_Spin2.png">
	<br>
	<br>

	<li><b>Name</b>
	<p>&nbsp;&nbsp;&nbsp;Spinコンポーネント名を入力します。</p>
	</li>
	<li><b>Min</b>
	<p>&nbsp;&nbsp;&nbsp;スピン範囲の最小値を指定します。</p>
	</li>
	<li><b>Max</b>
	<p>&nbsp;&nbsp;&nbsp;スピン範囲の最大値を指定します。</p>
	</li>
	<li><b>Value</b>
	<p>&nbsp;&nbsp;&nbsp;初期値を指定します。</p>
	</li>
	<li><b>Enable</b>
	<p>&nbsp;&nbsp;&nbsp;使用の可否を指定します。</p>
		<ul type="circle">
		<span style="font-size:0.95em;">
		<li><b>チェックオン</b>&nbsp;:&nbsp;使用可能。</li>
		<li><b>チェックオフ</b>&nbsp;:&nbsp;使用不可。（グレーアウトされます）</li>
		</span>
		</ul>
	</li>
	</div>
</div>
