<div class="page">
<h2>BreakFace</h2>
<div class="contents">
<h4>Description</h4>
<p>Break selected face</p>
<h4>Syntax</h4>
<p>BreakFace(Cursor[] FACE Cursor)</p>
<h4>Inputs</h4> 
<ol>
<li>Cursor[]<p> Target face cursor([6:Face ID])</p></li>
</ol> 
<h4>Return Code</h4>
<li>1<p>Succeeded</p></li>
<li>0<p>Failed</p></li>
<h4>Sample Code</h4>
<p>BreakFace([6:64, 6:537, 6:531, 6:534])</p>
</div>
